{% extends 'core/base.html' %}

{% block title %}Solicitar ingreso a {{ equipo.nombre }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header" style="background-color: {{ equipo.color_primario }}; color: white;">
                <h4 class="mb-0"><i class="fas fa-paper-plane"></i> Pedir unirme a {{ equipo.nombre }}</h4>
            </div>
            <div class="card-body">
                <div class="text-center mb-3">
                    {% if equipo.escudo %}
                        <img src="{{ equipo.escudo.url }}" alt="Escudo" style="max-height: 100px;">
                    {% else %}
                        <div class="rounded-circle d-inline-flex align-items-center justify-content-center"
                             style="width: 100px; height: 100px; background-color: {{ equipo.color_primario }}; color: white; font-size: 2rem; font-weight: bold;">
                            {{ equipo.get_iniciales }}
                        </div>
                    {% endif %}
                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="{{ form.mensaje.id_for_label }}" class="form-label">
                            {{ form.mensaje.label }}
                        </label>
                        {{ form.mensaje }}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane"></i> Enviar solicitud
                        </button>
                        <a href="{% url 'equipos:buscar' %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
