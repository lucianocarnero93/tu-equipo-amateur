{% extends 'core/base.html' %}

{% block title %}Desactivar invitación{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Desactivar invitación</h4>
            </div>
            <div class="card-body text-center">
                <p>¿Seguro que querés desactivar esta invitación?</p>
                <h5><code>{{ invitacion.codigo }}</code></h5>
                <p class="text-muted">Ya no se va a poder usar para unirse al equipo.</p>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-ban"></i> Sí, desactivar
                    </button>
                    <a href="{% url 'equipos:lista_invitaciones' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
